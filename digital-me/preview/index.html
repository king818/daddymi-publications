  { id: 'xborder', name: '跨境与第三方处理 · 单独确认', desc: '跨境与第三方处理单独勾选同意' },
  { id: 'liveness', name: '真人验证', desc: '朗读服务器下发短语录制 5–10 秒自拍视频' },
  { id: 'status', name: '我的进度', desc: '分身申请阶段与我的订制订单' }
];
function vIndex() {
  let h = '<div class="wrap"><div class="h1">小程序九页 · 模拟目录</div>' +
    '<div class="sub" style="margin:10px 0 14px">点任意一页直接看，或按流程从头走一遍：歌手 → 订制 → 做分身 → 提交 → 授权 → 跨境 → 真人验证 → 进度。</div>' +
    '<div class="btn btn-primary" data-go="home">▶ 按流程走一遍（从首页开始）</div>';
  PAGE_LIST.forEach((p, i) => {
    h += '<div class="card idx-item" data-go="' + p.id + '"><div class="idx-num">' + (i + 1) + '</div>' +
      '<div><div class="h2" style="margin-bottom:4px">' + p.name + '</div><div class="sub">' + p.desc + '</div></div></div>';
  });
  return h + footer() + '</div>';
}
function vHome() {
  let h = '<div class="wrap"><div class="lang-switch">🌐 ' + S.brand_line + '</div>' +
    '<div class="h1">' + S.hero_title + '</div>' +
    '<div class="sub" style="margin:10px 0 4px">' + S.hero_sub + '</div>' +
    '<div class="btn btn-primary" data-act="goIntake">' + S.hero_cta_intake + '</div>' +
    '<div class="btn btn-outline" data-act="goOrder">' + S.hero_cta_order + '</div>' +
    '<div class="h2" style="margin-top:18px">' + S.showcase_title + '</div>';
  SINGERS.forEach(sg => {
    h += '<div class="card" data-singer="' + sg.id + '"><div style="display:flex;justify-content:space-between;align-items:center">' +
      '<div class="h2" style="margin:0">' + sg.name + '</div>' +
      (sg.mode === 'preview_only' ? '<div class="badge-preview">' + S.preview_only_badge + '</div>' : '') +
      '</div><div class="sub">' + sg.tagline + '</div></div>';
  });
  return h + footer() + '</div>';
}
function vSinger() {
  const sg = SINGERS.find(x => x.id === state.singerId) || SINGERS[0];
  let h = '<div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center">' +
    '<div class="h1">' + sg.name + '</div>' +
    (sg.mode === 'preview_only' ? '<div class="badge-preview">' + S.preview_only_badge + '</div>' : '') +
    '</div><div class="sub" style="margin:8px 0">' + sg.tagline + '</div>';
  if (sg.songs.length) {
    h += '<div class="card"><div class="h2">' + S.singer_songs + '</div>' +
      sg.songs.map(x => '<div style="padding:5px 0">♪ ' + esc(x) + '</div>').join('') + '</div>';
  }
  h += '<div class="btn btn-primary" data-act="goIntake">' + S.singer_make_mine + '</div>';
  return h + footer() + '</div>';
}
function vOrder() {
  const A = state.line === 'A';
  let h = '<div class="wrap"><div class="h1">' + S.order_title + '</div>' +
    '<div style="display:flex;gap:8px;margin:12px 0">' +
    '<div class="btn ' + (A ? 'btn-primary' : 'btn-outline') + '" style="flex:1" data-line="A">' + S.order_line_a + '</div>' +
    '<div class="btn ' + (!A ? 'btn-primary' : 'btn-outline') + '" style="flex:1" data-line="B">' + S.order_line_b + '</div></div>' +
    '<div class="sub">' + (A ? S.order_line_a_sub : S.order_line_b_sub) + '</div>';
  if (A) {
    h += '<div class="card"><div class="h2">' + S.order_free_title + ' · ¥0</div><div class="sub">' + S.order_free_desc + '</div><div class="small">' + S.ta_free + '</div></div>';
  }
  TIERS.forEach(t => {
    h += '<div class="card" data-tier="' + t.id + '" style="' + (state.tier === t.id ? 'border-color:#8a5a2b;border-width:2px' : '') + '">' +
      '<div style="display:flex;justify-content:space-between"><div class="h2" style="margin:0">' + t.label + '</div>' +
      '<div class="price">¥' + (A ? t.A : t.B) + '</div></div>' +
      (t.includes ? '<div class="sub">' + t.includes + '</div>' : '') +
      (!t.saleable ? '<div class="small">' + S.order_reservation + '</div>' : '') +
      (t.ta ? '<div class="small">' + t.ta + '</div>' : '') + '</div>';
  });
  if (!A) {
    h += '<label class="label">' + S.order_target_hint + '</label>' +
      '<input class="input" placeholder="Bilibili / 抖音 / YouTube 账号名">' +
      '<div class="card" style="background:#fdf6e3"><div class="small">' + S.order_b2_rule + '</div></div>';
  }
  h += '<div class="small" style="margin:8px 0">' + S.order_ownvoice_note + '</div>' +
    '<div class="small">' + S.order_payment_pending + '</div>' +
    '<div class="btn btn-primary" data-act="orderSubmit">' + S.order_cta + '</div>';
  return h + footer() + '</div>';
}
function vIntake() {
  let h = '<div class="wrap"><div class="h1">' + S.intake_title + '</div>' +
    '<div class="sub" style="margin:7px 0">' + S.intake_steps + '</div>';
  if (!state.loggedIn) {
    h += '<div class="card"><div class="h2">' + S.intake_register_title + '</div>' +
      '<label class="label">' + S.intake_email + '</label><input class="input" id="f-email" placeholder="you@example.com">' +
      '<div class="btn btn-outline" data-act="sendCode">' + S.intake_send_code + '</div>' +
      '<label class="label">' + S.intake_email_code + '</label><input class="input" type="number">' +
      '<label class="label">' + S.intake_invite_code + '</label><input class="input" id="f-invite">' +
      '<label class="label">' + S.intake_stage_name + '</label><input class="input" id="f-stage">' +
      '<label class="label">' + S.intake_phone + '</label><input class="input">' +
      '<label class="label">' + S.intake_platforms + '</label><input class="input">' +
      '<div class="why">' + S.intake_why_email + '</div>' +
      '<div class="btn btn-primary" data-act="register">' + S.intake_register_btn + '</div></div>';
  } else {
    h += '<div class="card"><div class="btn btn-primary" data-go="submit">' + S.submit_title + '</div>' +
      '<div class="btn btn-outline" data-go="status">' + S.status_title + '</div></div>';
  }
  return h + footer() + '</div>';
}
function vSubmit() {
  let h = '<div class="wrap"><div class="h1">' + S.submit_title + '</div><div class="card">' +
    '<label class="label">' + S.submit_photos + '</label><div class="btn btn-outline" data-add="photo">' + S.submit_add + ' 📷</div>' +
    '<label class="label">' + S.submit_voice + '</label><div class="btn btn-outline" data-add="voice">' + S.submit_add + ' 🎙</div>' +
    '<label class="label">' + S.submit_video + '</label><div class="btn btn-outline" data-add="video">' + S.submit_add + ' 🎬</div>' +
    state.files.map(f => '<div class="small">' + f + '</div>').join('') +
    '</div><div class="card"><label class="label">' + S.submit_story + '</label>' +
    '<textarea class="input" maxlength="5000"></textarea></div>' +
    '<div class="small">' + S.submit_quota + '</div>' +
    '<div class="small" style="margin-top:5px">' + S.submit_quarantine_note + '</div>' +
    '<div class="btn btn-primary" data-act="submitAll">' + S.submit_btn + '</div>';
  return h + footer() + '</div>';
}
</script>
<script>
function vConsent() {
  let rows = '';
  CONSENT_ITEMS.forEach(it => {
    const pill = it.disabled ? '<span class="pill">' + S.consent_disabled_v1 + '</span>'
      : it.req ? '<span class="pill">' + S.consent_required + '</span>'
      : '<span class="pill">' + S.consent_optional + '</span>';
    if (it.id === 'uses') {
      rows += '<div class="switch-row"><div class="switch-txt"><div>' + it.label + ' ' + pill + '</div><div class="why">' + it.why + '</div>' +
        '<div style="margin-top:7px">' +
        '<div class="subrow"><span>' + S.consent_use_private + '</span>' + sw('use_private', state.uses.use_private) + '</div>' +
        '<div class="subrow"><span>' + S.consent_use_showcase + '</span>' + sw('use_showcase', state.uses.use_showcase) + '</div>' +
        '<div class="subrow"><span>' + S.consent_use_commercial + '</span>' + sw('use_commercial', state.uses.use_commercial) + '</div>' +
        '</div></div></div>';
    } else if (it.id === 'channels') {
      rows += '<div class="switch-row"><div class="switch-txt"><div>' + it.label + ' ' + pill + '</div><div class="why">' + it.why + '</div>' +
        CHANNELS.map(ch => '<div class="subrow"><span>' + ch + '</span>' + sw('ch:' + ch, !!state.channels[ch]) + '</div>').join('') +
        '</div></div>';
    } else if (it.id === 'territory') {
      rows += '<div class="switch-row"><div class="switch-txt"><div>' + it.label + ' ' + pill + '</div><div class="why">' + it.why + '</div>' +
        '<select class="input" id="territorySel" style="margin-top:7px">' +
        [S.territory_china_mainland, S.territory_greater_china, S.territory_worldwide].map(x =>
          '<option' + (state.territory === x ? ' selected' : '') + '>' + x + '</option>').join('') +
        '</select></div></div>';
    } else {
      rows += '<div class="switch-row"><div class="switch-txt"><div>' + it.label + ' ' + pill + '</div><div class="why">' + it.why + '</div></div>' +
        sw(it.id, !!state.consent[it.id], it.disabled) + '</div>';
    }
  });
  rows += '<div style="padding-top:10px"><label class="label">授权期限 / Term (' + state.termYears + ')</label>' +
    '<input type="range" min="1" max="5" step="1" value="' + state.termYears + '" id="termSlider"></div>';
  return '<div class="wrap"><div class="h1">' + S.consent_title + '</div>' +
    '<div class="sub" style="margin:8px 0">' + S.consent_intro + '</div>' +
    '<div class="card">' + rows + '</div>' +
    '<div class="btn btn-primary" data-act="consentNext">' + S.consent_next_xborder + '</div>' + footer() + '</div>';
}
function vXborder() {
  return '<div class="wrap"><div class="h1">' + S.xborder_title + '</div>' +
    '<div class="card"><div class="sub">' + S.xborder_body + '</div></div>' +
    '<label class="chk"><input type="checkbox" id="xbChk"' + (state.xborderAgreed ? ' checked' : '') + '>' +
    '<span style="flex:1;font-size:14px;line-height:1.55">' + S.xborder_agree + '</span></label>' +
    '<div class="btn btn-primary' + (state.xborderAgreed ? '' : ' disabled') + '" data-act="xborderNext">' + S.xborder_next + '</div>' +
    footer() + '</div>';
}
function vLiveness() {
  /* Phrase format is the server format (backend/src/server.js); code/keyword are sample placeholders. */
  const phrase = '我是' + (state.stageName || '本人') + '，今天是2026年11月13日，我自愿授权米老爸工作室为我制作数字分身，验证码 4821，关键词 苹果。（示例短语）';
  let h = '<div class="wrap"><div class="h1">' + S.liveness_title + '</div>' +
    '<div class="card"><div class="sub">' + S.liveness_body + '</div>' +
    '<div style="margin-top:10px;font-size:16px;line-height:1.6;font-weight:600">' + S.liveness_phrase_prefix + '</div>' +
    '<div style="font-size:16px;line-height:1.6;color:#8a5a2b">' + phrase + '</div></div>' +
    '<div class="small">' + S.liveness_note + '</div>';
  if (state.recorded) h += '<div class="fakevideo">▶ 示例录像（模拟）· 0:07</div>';
  h += '<div class="btn btn-outline" data-act="record">' + (state.recorded ? S.liveness_rerecord : S.liveness_record) + '</div>' +
    '<div class="btn btn-primary' + (state.recorded ? '' : ' disabled') + '" data-act="livenessSubmit">' + S.liveness_submit + '</div>';
  return h + footer() + '</div>';
}
function vStatus() {
  let h = '<div class="wrap"><div class="h1">' + S.status_title + '</div>';
  if (state.appStage) {
    const label = state.appStage === 'submitted' ? S.st_submitted : S.st_authorization_pending;
    const idx = state.appStage === 'submitted' ? 2 : 5;
    h += '<div class="card"><div class="h2">' + S.status_application + '</div>' +
      '<div class="small">' + S.status_case + ': DM-2026-0001（示例编号）</div>' +
      '<div style="margin:8px 0"><span class="stage-dot"></span><span>' + S.status_current + ': <b>' + label + '</b> (' + idx + '/16)</span></div>';
    if (state.appStage === 'authorization_pending')
      h += '<div class="btn btn-outline" data-go="consent">' + S.consent_title + '</div>';
    h += '</div>';
  }
  if (state.orders.length) {
    h += '<div class="card"><div class="h2">' + S.status_orders + '</div>' +
      state.orders.map(o => '<div class="small" style="padding:4px 0">' + o + '</div>').join('') + '</div>';
  }
  if (!state.appStage && !state.orders.length)
    h += '<div class="sub" style="margin-top:10px">（尚无申请与订单——先从「做分身」注册，或在「订制」记录一份意向，这里就会出现进度。）</div>';
  return h + footer() + '</div>';
}
const VIEWS = { index: vIndex, home: vHome, singer: vSinger, order: vOrder, intake: vIntake, submit: vSubmit, consent: vConsent, xborder: vXborder, liveness: vLiveness, status: vStatus };
function render() {
  $main.innerHTML = '<section class="screen active">' + VIEWS[state.screen]() + '</section>';
  document.getElementById('navBack').style.visibility = state.screen === 'index' ? 'hidden' : 'visible';
  document.getElementById('tabbar').style.display = state.screen === 'index' ? 'none' : 'flex';
  document.querySelectorAll('#tabbar div').forEach(d => d.classList.toggle('sel', d.dataset.tab === state.tab));
}
const BACK = { singer: 'home', submit: 'intake', consent: 'submit', xborder: 'consent', liveness: 'xborder' };
document.getElementById('navBack').addEventListener('click', () => go(BACK[state.screen] || 'index'));
document.getElementById('tabbar').addEventListener('click', e => { const t = e.target.dataset.tab; if (t) go(t); });
$main.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]'); if (goEl) { go(goEl.dataset.go); return; }
  const sgEl = e.target.closest('[data-singer]'); if (sgEl) { state.singerId = sgEl.dataset.singer; go('singer'); return; }
  const lineEl = e.target.closest('[data-line]'); if (lineEl) { state.line = lineEl.dataset.line; render(); return; }
  const tierEl = e.target.closest('[data-tier]'); if (tierEl) { state.tier = tierEl.dataset.tier; render(); return; }
  const addEl = e.target.closest('[data-add]'); if (addEl) {
    const k = addEl.dataset.add;
    if (k === 'voice') { toast('🎙'); return; }
    state.files.push(k + ' · 示例文件 ✓'); render(); return;
  }
  const actEl = e.target.closest('[data-act]'); if (!actEl) return;
  const act = actEl.dataset.act;
  if (act === 'goIntake') go('intake');
  else if (act === 'goOrder') go('order');
  else if (act === 'sendCode') toast('✓');
  else if (act === 'register') {
    const st = document.getElementById('f-stage');
    state.stageName = st ? st.value.trim() : '';
    state.loggedIn = true; state.appStage = 'authorization_pending';
    go('submit');
  }
  else if (act === 'orderSubmit') {
    if (!state.loggedIn) { go('intake'); return; } /* real app: switchTab to intake when not logged in */
    const t = TIERS.find(x => x.id === state.tier);
    state.orders.push(state.line + ' · ' + t.id + ' · ¥' + (state.line === 'A' ? t.A : t.B) + ' · submitted');
    toast(S.order_submit_ok, 2600);
  }
  else if (act === 'submitAll') go('consent');
  else if (act === 'consentNext') {
    const missing = !state.consent.portrait_modeling || !state.consent.ai_generation || !state.uses.use_private ||
      !state.consent.third_parties || !state.consent.withdrawal || !state.consent.ai_labeling || !state.consent.adult_declaration;
    if (missing) { toast(S.err_required_consent, 2800); return; }
    go('xborder');
  }
  else if (act === 'xborderNext') { if (state.xborderAgreed) go('liveness'); }
  else if (act === 'record') { state.recorded = true; render(); }
  else if (act === 'livenessSubmit') {
    if (!state.recorded) return;
    state.appStage = 'submitted';
    toast('✓ 已提交，等待工作室人工复核');
    setTimeout(() => go('status'), 900);
  }
});
$main.addEventListener('change', e => {
  const swEl = e.target.closest('[data-sw]');
  if (swEl) {
    const id = swEl.dataset.sw, on = swEl.checked;
    if (id.indexOf('use_') === 0) state.uses[id] = on;
    else if (id.indexOf('ch:') === 0) state.channels[id.slice(3)] = on;
    else state.consent[id] = on;
    return;
  }
  if (e.target.id === 'territorySel') state.territory = e.target.value;
  if (e.target.id === 'termSlider') { state.termYears = Number(e.target.value); render(); }
  if (e.target.id === 'xbChk') { state.xborderAgreed = e.target.checked; render(); }
});
render();
</script>
</body>
</html>
